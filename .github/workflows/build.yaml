name: Latest build
on:
  schedule:
    - cron: '30 23 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      OCP_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install ocp
        run: |
          curl -sSfL "https://github.com/onecx/ocp/releases/download/${OCP_VERSION}/ocp_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin ocp
          ocp --help

      - name: Create repository
        run: ocp repository creates --file products.yaml --repository repository

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update repository"
            git push
          fi